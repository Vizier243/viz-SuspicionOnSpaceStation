# Contains the gear for the suspicion gamemode. Most of this stuff will be unremovable.

- type: entity
  parent: ClothingHeadsetAltSecurity
  id: ClothingHeadsetGreySuspicion
  name: security bowman headset
  description: Not a headset to listen to tunes with, unfortunately.
  components:
  - type: Unremoveable

- type: entity
  parent: ClothingUniformJumpsuitERTSecurity
  id: ClothingUniformJumpsuitColorWhiteSuspicion
  name: emergency response security jumpsuit
  description: A security jumpsuit. Seems standard enough.
  components:
  - type: Unremoveable

- type: entity
  parent: ClothingBackpackSecurity
  id: ClothingBackpackSuspicion
  name: security backpack
  description: A very robust military backpack. For some reason, guns don't seem to fit in it...
  components:
  - type: Unremoveable
  - type: Storage
    grid:
    - 0,0,3,3
    maxItemSize: Huge
    blacklist:
      components:
      - Gun

- type: entity
  parent: ClothingOuterArmorBasic
  id: ClothingOuterVestWebMercSuspicion
  suffix: SSS
  components:
  - type: Storage
    grid:
    - 0,0,2,1
    blacklist:
      components:
      - Gun
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9 # 30% to 10% resistance, Blunt and Slash are underused damage types, increased viability for Melee
        Slash: 0.9
        Piercing: 0.7 # 50% to 30% resistance, giving a path for upgradable armour. Fine tune this value as it could be 20% instead.
        Heat: 0.9
  - type: ExplosionResistance
    damageCoefficient: 0.9 # Leaving this incase we want to modify it.
  - type: Construction
    graph: UpgradeClothingOuterVestWebMercSuspicion
    node: start

- type: entity
  parent: ClothingOuterVestWebMercSuspicion
  id: ClothingOuterVestWebMercSuspicionUpgraded
  suffix: SSS-Upgraded
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.5 # 30% back to 50%, weaker to the base game bulletproofvest
        Heat: 0.9
  - type: ExplosionResistance
    damageCoefficient: 0.8 # 10% to 20%, equivilent to the base game bulletproofvest
  - type: Construction
    graph: UpgradeClothingOuterVestWebMercSuspicion
    node: upgraded

- type: entity
  parent: SecurityIDCard
  id: HoPIDCardSuspicion
  components:
  - type: Unremoveable

- type: startingGear
  id: SuspicionGear
  equipment:
    ears: ClothingHeadsetGreySuspicion
    jumpsuit: ClothingUniformJumpsuitColorWhiteSuspicion
    shoes: ClothingShoesBootsJack
    gloves: ClothingHandsGlovesCombat
    back: ClothingBackpackSuspicion
    outerClothing: ClothingOuterVestWebMercSuspicion
    id: HoPIDCardSuspicion
    belt: ClothingBeltSecSuspicion

- type: entity
  parent: ClothingBeltSecurity
  id: ClothingBeltSecSuspicion
  name: security belt
  description: The thing every revolutionary tider wants ahold of.
  components:
  - type: Unremoveable
  - type: Sprite
    sprite: Clothing/Belt/security.rsi
  - type: Clothing
    sprite: Clothing/Belt/security.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: Storage
    whitelist:
      tags:
        - CigPack
        - Taser
        - SecBeltEquip
        - Radio
        - Sidearm
        - MagazinePistol
        - MagazineMagnum
        - CombatKnife
        - Truncheon
      components:
        - Stunbaton
        - FlashOnTrigger
        - SmokeOnTrigger
        - Flash
        - Handcuff
        - BallisticAmmoProvider
        - CartridgeAmmo
        - DoorRemote
        - Whistle
        - BalloonPopper
  - type: ItemMapper
    mapLayers:
      flashbang:
        whitelist:
          components:
          - FlashOnTrigger
      stunbaton:
        whitelist:
          components:
          - Stunbaton
      tear_gas_grenade:
        whitelist:
          components:
          - SmokeOnTrigger
    sprite: Clothing/Belt/belt_overlay.rsi
  - type: Appearance
